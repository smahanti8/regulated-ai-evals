system: surgical-fhir

# Claims about the terminology-trust layer of the surgical FHIR pipeline,
# pinned at e61d181. The mapping, quality, store and API layers are declared
# out of scope below rather than omitted: an auditor reading a matrix cannot
# tell a boundary from a gap unless both are written down.

requirements:
  - id: REQ-TX-001
    statement: >
      A terminology binding is reported as trusted only when its status is
      VERIFIED. There is no implicit promotion from PROVISIONAL.
    rationale: >
      A provisional binding is a developer's assertion that two codes mean the
      same thing. Downstream, a CodeableConcept carries no visible difference
      between an asserted mapping and one checked against an authoritative
      release, so the distinction has to be enforced at the boundary or it is
      lost permanently.
    risk_class: decision_driving
    acceptance: >
      Binding.is_trusted is True for VERIFIED and False for every other status,
      including DEPRECATED.

  - id: REQ-TX-002
    statement: >
      A local code with no binding raises UnmappedConceptError. The pipeline
      never emits an uncoded concept in place of a coded one.
    rationale: >
      An uncoded CodeableConcept is worse than a missing one: it looks like
      valid data and is invisible to every query that matters. Refusing is the
      only behaviour that surfaces the gap while it is still cheap to fix.
    risk_class: decision_driving
    acceptance: >
      procedure_binding, observation_binding, ucum_unit and procedure_status
      each raise UnmappedConceptError on an unknown input, and the error names
      the offending code and its domain.

  - id: REQ-TX-003
    statement: >
      coverage_report() reports the trusted fraction of the concept map, and
      its counts reconcile with the binding table it summarises.
    rationale: >
      The report is the only place the provisional fraction becomes visible to
      anyone who is not reading the source. A governance metric that can drift
      from the thing it measures is worse than no metric.
    risk_class: informational
    acceptance: >
      verified + provisional == total == len(all_bindings()), and each count
      matches an independent recount of the table by status.

  - id: REQ-TX-004
    statement: >
      administrative_gender degrades an unknown value to "unknown" rather than
      raising, as a deliberate and bounded exception to the fail-loud rule.
    behavioural_statement: >
      Unknown and absent gender values return "unknown".
    rationale: >
      Administrative gender is not clinically load-bearing in this pipeline and
      FHIR defines "unknown" as a valid value, so refusing the case would drop
      a whole surgical record over a field nothing depends on. The exception is
      defensible; leaving it undeclared is not, because the next reader cannot
      tell it from an oversight.
    risk_class: supportive
    acceptance: >
      administrative_gender(None) and administrative_gender("wat") both return
      "unknown"; no exception is raised.

  - id: REQ-TX-005
    statement: >
      The concept map is fit for clinical exchange.
    behavioural_statement: >
      The verified/provisional split is measured and published. Whether it is
      adequate is not decided anywhere in the system.
    rationale: >
      Stated deliberately as the claim someone would make in a sales
      conversation or an integration review, to show what the harness does with
      it. The pipeline measures the split honestly and publishes it; nothing
      consumes the number to gate anything, so there is no boundary behind the
      word "fit".
    risk_class: decision_driving
    acceptance: >
      The provisional fraction is at or below a defined ceiling.
    thresholds: [THR-FHIR-PROVISIONAL-CEILING]

  # ---------------------------------------------------------------------
  # Out of scope for this run. Verified in the pipeline's own suite; not
  # undertaken here. Listed so the matrix distinguishes a scope decision
  # from missing evidence.
  # ---------------------------------------------------------------------

  - id: REQ-TX-010
    statement: >
      A case with an unmapped procedure code or missing laterality is dropped
      rather than degraded.
    rationale: >
      The pipeline's central design decision. Verified upstream by
      test_unmapped_procedure_code_drops_case.
    risk_class: decision_driving
    scope: out_of_scope
    scope_note: >
      Requires mapping.py and the synthetic case generator. This run scopes to
      the terminology-trust layer.
    acceptance: >
      map_case returns no resources and an ERROR-severity issue naming the
      element.

  - id: REQ-TX-011
    statement: >
      No raw medical record number reaches FHIR output.
    rationale: >
      The pipeline's identifier boundary, enforced upstream by
      test_no_raw_mrn_leaks_into_output.
    risk_class: decision_driving
    scope: out_of_scope
    scope_note: >
      Requires mapping.py. Named here because an evidence bundle that silently
      omits the identifier-boundary claim invites the reader to assume it was
      covered.
    acceptance: >
      No source identifier value appears in any emitted resource.

  - id: REQ-TX-012
    statement: >
      The quality report states the exchangeable fraction and attributes every
      dropped case to the element that caused the drop.
    rationale: >
      The pipeline's headline deliverable. Verified upstream.
    risk_class: informational
    scope: out_of_scope
    scope_note: >
      Requires quality.py and mapping.py.
    acceptance: >
      exchangeable_rate reconciles with cases_in and cases_dropped, and
      error_by_element accounts for every drop.
